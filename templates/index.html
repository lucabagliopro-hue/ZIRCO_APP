<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIRCO // HUD CENTRAL</title>
    <style>
        :root {
            --bg-color: #02060d;
            --panel-bg: rgba(2, 15, 30, 0.85);
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --text-main: #e0fbfc;
            --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 10px;
            margin-bottom: 15px;
            box-shadow: var(--glow-cyan);
        }
        h1 {
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin: 0;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border: 1px solid var(--accent-cyan);
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.1);
        }
        #chat-container {
            width: 100%;
            max-width: 900px;
            flex-grow: 1;
            background: var(--panel-bg);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 119, 255, 0.15);
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 14px;
            border-radius: 6px;
            line-height: 1.6;
            max-width: 85%;
            font-size: 0.95rem;
        }
        .user-message {
            background: rgba(0, 119, 255, 0.2);
            border-left: 4px solid var(--accent-blue);
            align-self: flex-end;
            color: #ffffff;
        }
        .zirco-message {
            background: rgba(0, 240, 255, 0.08);
            border-left: 4px solid var(--accent-cyan);
            align-self: flex-start;
            color: var(--accent-cyan);
            white-space: pre-wrap;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
        }
        #input-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: rgba(1, 5, 12, 0.95);
            border: 1px solid var(--accent-cyan);
            color: var(--text-main);
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
        }
        #user-input:focus {
            box-shadow: var(--glow-cyan);
        }
        button {
            background: rgba(0, 119, 255, 0.3);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 0 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: var(--glow-cyan);
        }
        #mic-btn {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
            font-size: 1.2rem;
            padding: 0 18px;
        }
        #mic-btn.listening {
            background: #ff0055;
            color: #fff;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>ZIRCO // HUD CENTRAL</h1>
        <div class="status-badge" id="status-badge">ONLINE [SUPABASE + 3.5-FLASH]</div>
    </header>
    
    <div id="chat-container">
        <div class="message zirco-message">Système opérationnel, Monsieur. Liaison Supabase active, traitement vectoriel et vocal en ligne. Quelle est votre directive ?</div>
    </div>

    <div id="input-container">
        <button id="mic-btn" onclick="toggleSpeechRecognition()" title="Activer la reconnaissance vocale">🎙️</button>
        <input type="text" id="user-input" placeholder="Entrer une directive ou parler..." onkeypress="handleKeyPress(event)">
        <button onclick="sendDirective()">EXÉCUTER</button>
    </div>

    <script>
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const micBtn = document.getElementById("mic-btn");

        function speakText(text) {
            // Lecture audio optimisée et rapide
            fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.blob())
            .then(blob => {
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                audio.play();
            })
            .catch(err => console.error("Erreur flux audio :", err));
        }

        function sendDirective() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = "";

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                appendMessage(data.response, 'zirco-message');
                speakText(data.response);
            })
            .catch(err => {
                appendMessage("Erreur critique de transmission.", 'zirco-message');
            });
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendDirective();
            }
        }

        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                userInput.value = event.results[0][0].transcript;
                stopListening();
                sendDirective();
            };

            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        } else {
            micBtn.style.display = 'none';
        }

        function toggleSpeechRecognition() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                micBtn.classList.add('listening');
                isListening = true;
                userInput.placeholder = "Écoute du canal vocal...";
            }
        }

        function stopListening() {
            micBtn.classList.remove('listening');
            isListening = false;
            userInput.placeholder = "Entrer une directive ou parler...";
        }
    </script>
</body>
</html>
