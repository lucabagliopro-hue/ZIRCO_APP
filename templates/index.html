<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIRCO // HUD CENTRAL</title>
    <!-- Three.js pour la sphère 3D de particules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #010409;
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --text-main: #e0fbfc;
            --glow-cyan: 0 0 25px rgba(0, 240, 255, 0.5);
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- NOYAU 3D PLEIN ÉCRAN ARRIÈRE-PLAN --- */
        #webgl-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header, .hud-overlay {
            position: relative;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(1, 4, 9, 0.65);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            backdrop-filter: blur(12px);
            box-shadow: var(--glow-cyan);
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            margin: 0;
            color: var(--accent-cyan);
            text-shadow: 0 0 12px var(--accent-cyan);
        }
        .header-info {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--accent-cyan);
        }

        /* --- INTERFACE FLUIDE & FLOTTANTE --- */
        .hud-overlay {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        #chat-container {
            height: 32vh;
            background: rgba(1, 8, 18, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(15px);
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 0 20px rgba(0, 119, 255, 0.2);
        }
        .message {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 88%;
        }
        .user-message {
            background: rgba(0, 119, 255, 0.25);
            border-left: 3px solid var(--accent-blue);
            align-self: flex-end;
            color: #ffffff;
        }
        .zirco-message {
            background: rgba(0, 240, 255, 0.08);
            border-left: 3px solid var(--accent-cyan);
            align-self: flex-start;
            color: var(--accent-cyan);
            white-space: pre-wrap;
        }

        #input-container {
            display: flex;
            gap: 12px;
            background: rgba(1, 8, 18, 0.85);
            padding: 10px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(15px);
            box-shadow: var(--glow-cyan);
        }
        #user-input {
            flex-grow: 1;
            background: rgba(1, 4, 9, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }
        #user-input:focus {
            box-shadow: var(--glow-cyan);
            border-color: var(--accent-cyan);
        }
        button {
            background: rgba(0, 119, 255, 0.3);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 0 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: var(--glow-cyan);
        }
        #mic-btn {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
            font-size: 1.1rem;
            padding: 0 18px;
        }
        #mic-btn.listening {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.9);
            animation: pulse-mic 1s infinite;
        }
        @keyframes pulse-mic {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- SPHÈRE 3D THREE.JS EN ARRIÈRE-PLAN -->
    <div id="webgl-container"></div>

    <header>
        <h1>ZIRCO // HUD CENTRAL</h1>
        <div class="header-info">
            <div id="weather-box">Météo : 22°C</div>
            <div id="clock-box">00:00:00</div>
        </div>
    </header>

    <div class="hud-overlay">
        <div id="chat-container">
            <div class="message zirco-message">Noyau holographique unifié actif, Monsieur. Système fluide et opérationnel. Quelle est votre directive ?</div>
        </div>

        <div id="input-container">
            <button id="mic-btn" onclick="toggleSpeechRecognition()" title="Activer le micro">🎙️</button>
            <input type="text" id="user-input" placeholder="Entrer une directive ou parler..." onkeypress="handleKeyPress(event)">
            <button onclick="sendDirective()">EXÉCUTER</button>
        </div>
    </div>

    <script>
        // --- HORLOGE ---
        function updateClock() {
            document.getElementById('clock-box').innerText = new Date().toLocaleTimeString('fr-FR');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- THREE.JS SPHERE DE PARTICULES ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.2;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particleCount = 4500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.9 + Math.random() * 0.15;

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
            color: 0x00f0ff,
            size: 0.022,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSphere = new THREE.Points(geometry, material);
        scene.add(particleSphere);

        function animate() {
            requestAnimationFrame(animate);
            particleSphere.rotation.y += 0.0018;
            particleSphere.rotation.x += 0.0009;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- INTERACTION CHAT & VOCAL ---
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const micBtn = document.getElementById("mic-btn");

        function speakText(text) {
            fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.blob())
            .then(blob => {
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
            });
        }

        function sendDirective() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = "";

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                appendMessage(data.response, 'zirco-message');
                speakText(data.response);
            });
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendDirective();
        }

        let recognition;
        let isListening = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                stopListening();
                sendDirective();
            };
            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        }

        function toggleSpeechRecognition() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                micBtn.classList.add('listening');
                isListening = true;
            }
        }

        function stopListening() {
            micBtn.classList.remove('listening');
            isListening = false;
        }
    </script>
</body>
</html>
