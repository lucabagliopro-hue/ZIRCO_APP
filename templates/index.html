<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIRCO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #010409;
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --text-main: #e0fbfc;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #webgl-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        header, .main-layout {
            position: relative;
            z-index: 10;
        }
        header {
            padding: 10px 20px;
            background: rgba(1, 4, 9, 0.75);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 4px;
            margin: 0;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            flex-grow: 1;
            margin-top: 15px;
            overflow: hidden;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            #agenda-panel { display: none; }
        }

        .panel-box {
            background: rgba(2, 12, 24, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0, 119, 255, 0.15);
        }
        .panel-title {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            max-height: 45vh;
        }
        .message {
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 90%;
        }
        .user-message {
            background: rgba(0, 119, 255, 0.25);
            border-left: 3px solid var(--accent-blue);
            align-self: flex-end;
            color: #ffffff;
        }
        .zirco-message {
            background: rgba(0, 240, 255, 0.08);
            border-left: 3px solid var(--accent-cyan);
            align-self: flex-start;
            color: var(--accent-cyan);
            white-space: pre-wrap;
        }

        #input-container {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: rgba(1, 5, 12, 0.9);
            border: 1px solid var(--accent-cyan);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        button {
            background: rgba(0, 119, 255, 0.3);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: var(--glow-cyan);
        }
        #mic-btn {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
            font-size: 1.1rem;
        }
        #mic-btn.listening {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.9);
            animation: pulse-mic 1s infinite;
        }
        @keyframes pulse-mic {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- TABLEAU AGENDA & NOTES --- */
        .agenda-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .agenda-table th, .agenda-table td {
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 8px;
            text-align: left;
        }
        .agenda-table th {
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <header>
        <h1>ZIRCO</h1>
    </header>

    <div class="main-layout">
        <div class="panel-box">
            <div class="panel-title">Canal de Communication</div>
            <div id="chat-container">
                <div class="message zirco-message">Système opérationnel, Monsieur. Prêt pour vos directives.</div>
            </div>
            <div id="input-container">
                <button id="mic-btn" onclick="toggleSpeechRecognition()" title="Activer/Désactiver le micro">🎙️</button>
                <input type="text" id="user-input" placeholder="Entrer une directive ou parler..." onkeypress="handleKeyPress(event)">
                <button onclick="sendDirective()">EXÉCUTER</button>
            </div>
        </div>

        <div class="panel-box" id="agenda-panel">
            <div class="panel-title">Agenda & Routines</div>
            <div style="overflow-y: auto;">
                <table class="agenda-table">
                    <thead>
                        <tr>
                            <th>Horaire</th>
                            <th>Mission</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>08:00</td><td>Briefing Métallurgie</td></tr>
                        <tr><td>12:00</td><td>Recrutement & Actu</td></tr>
                        <tr><td>14:00</td><td>Quantique & EPR</td></tr>
                        <tr><td>20:00</td><td>Bilan Technique</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // THREE.JS SPHERE 3D
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.2;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particleCount = 4000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.85 + Math.random() * 0.1;

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
            color: 0x00f0ff,
            size: 0.022,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSphere = new THREE.Points(geometry, material);
        scene.add(particleSphere);

        function animate() {
            requestAnimationFrame(animate);
            particleSphere.rotation.y += 0.0015;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // INTERACTION & VOCAL NETTOYÉ
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const micBtn = document.getElementById("mic-btn");

        function speakText(text) {
            // Nettoyage des caractères Markdown pour éviter qu'il ne dise "astérisque"
            const cleanText = text.replace(/[\*\_\#\`]/g, '');
            fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: cleanText })
            })
            .then(res => res.blob())
            .then(blob => {
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
            });
        }

        function sendDirective() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = "";

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                appendMessage(data.response, 'zirco-message');
                speakText(data.response);
            });
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendDirective();
        }

        // Reconnaissance Vocale avec micro persistant
        let recognition;
        let isListening = false;
        let continuousListening = true; // Garde le micro ouvert

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true; // Reste ouvert
            recognition.interimResults = false;

            recognition.onresult = (e) => {
                const transcript = e.results[e.results.length - 1][0].transcript;
                userInput.value = transcript;
                sendDirective();
            };

            recognition.onerror = () => {
                if (isListening) recognition.start();
            };

            recognition.onend = () => {
                if (isListening) {
                    recognition.start(); // Relance automatique si coupé
                }
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
                micBtn.classList.remove('listening');
                userInput.placeholder = "Entrer une directive ou parler...";
            } else {
                isListening = true;
                recognition.start();
                micBtn.classList.add('listening');
                userInput.placeholder = "Écoute active en cours...";
            }
        }
    </script>
</body>
</html>
