<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIRCO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #010409;
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --text-main: #e0fbfc;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- SPHÈRE 3D EN ARRIÈRE-PLAN --- */
        #webgl-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header, .main-layout {
            position: relative;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }
        h1 {
            font-size: 1.3rem;
            letter-spacing: 5px;
            margin: 0;
            color: var(--accent-cyan);
            text-shadow: 0 0 12px var(--accent-cyan);
        }

        /* Météo et Heure discrètes en haut à droite derrière le 3D */
        .top-right-hud {
            font-size: 0.75rem;
            color: rgba(0, 240, 255, 0.7);
            text-align: right;
            background: rgba(1, 4, 9, 0.4);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        /* --- LAYOUT PRINCIPAL --- */
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
            align-items: center;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            #agenda-panel { display: none; }
        }

        .panel-box {
            background: rgba(1, 8, 18, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 119, 255, 0.15);
        }
        .panel-title {
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #chat-container {
            height: 38vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .message {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 90%;
        }
        .user-message {
            background: rgba(0, 119, 255, 0.25);
            border-left: 3px solid var(--accent-blue);
            align-self: flex-end;
            color: #ffffff;
        }
        .zirco-message {
            background: rgba(0, 240, 255, 0.08);
            border-left: 3px solid var(--accent-cyan);
            align-self: flex-start;
            color: var(--accent-cyan);
            white-space: pre-wrap;
        }

        #input-container {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: rgba(1, 4, 9, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        #user-input:focus {
            box-shadow: var(--glow-cyan);
        }
        button {
            background: rgba(0, 119, 255, 0.3);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 0 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: var(--glow-cyan);
        }
        #mic-btn {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
            font-size: 1.1rem;
        }
        #mic-btn.listening {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.9);
            animation: pulse-mic 1s infinite;
        }
        @keyframes pulse-mic {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- AGENDA DYNAMIQUE (BAS À GAUCHE / GÉRÉ PAR VOUS) --- */
        .agenda-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .agenda-table th, .agenda-table td {
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 8px;
            text-align: left;
        }
        .agenda-table th {
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <header>
        <h1>ZIRCO</h1>
        <div class="top-right-hud">
            <div id="weather-box">Mulhouse : 27°C, Dégagé</div>
            <div id="clock-box">00:00:00</div>
        </div>
    </header>

    <div class="main-layout">
        <div class="panel-box">
            <div class="panel-title">Canal de Communication</div>
            <div id="chat-container">
                <div class="message zirco-message">Système opérationnel, Monsieur. Prêt pour vos directives.</div>
            </div>
            <div id="input-container">
                <button id="mic-btn" onclick="toggleSpeechRecognition()" title="Activer/Désactiver le micro">🎙️</button>
                <input type="text" id="user-input" placeholder="Entrer une directive ou parler..." onkeypress="handleKeyPress(event)">
                <button onclick="sendDirective()">EXÉCUTER</button>
            </div>
        </div>

        <!-- AGENDA DYNAMIQUE EN BAS À GAUCHE / PANNEAU DÉDIÉ -->
        <div class="panel-box" id="agenda-panel">
            <div class="panel-title">Agenda Dynamique</div>
            <div style="overflow-y: auto; max-height: 30vh;">
                <table class="agenda-table" id="agenda-table">
                    <thead>
                        <tr>
                            <th>Date / Heure</th>
                            <th>Événement</th>
                        </tr>
                    </thead>
                    <tbody id="agenda-body">
                        <!-- Les rendez-vous s'ajouteront ici dynamiquement -->
                        <tr><td colspan="2" style="color: rgba(255,255,255,0.4); text-align: center;">Aucun événement enregistré.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- HORLOGE & TEMPS RÉEL (Mulhouse) ---
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('fr-FR', options);
            const timeStr = now.toLocaleTimeString('fr-FR');
            document.getElementById('clock-box').innerText = `${dateStr} - ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- THREE.JS SPHERE 3D ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4.0;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particleCount = 4500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.7 + Math.random() * 0.1;

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
            color: 0x00f0ff,
            size: 0.022,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSphere = new THREE.Points(geometry, material);
        scene.add(particleSphere);

        function animate() {
            requestAnimationFrame(animate);
            particleSphere.rotation.y += 0.0015;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- GESTION AGENDA DYNAMIQUE ---
        function addAgendaItem(dateTime, eventText) {
            const tbody = document.getElementById('agenda-body');
            // Supprimer le message "aucun événement" si présent
            if (tbody.rows.length === 1 && tbody.rows[0].cells.length === 1) {
                tbody.innerHTML = "";
            }
            const row = tbody.insertRow();
            row.insertCell(0).innerText = dateTime;
            row.insertCell(1).innerText = eventText;
        }

        // --- INTERACTION & VOCAL ---
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const micBtn = document.getElementById("mic-btn");

        function speakText(text) {
            const cleanText = text.replace(/[\*\_\#\`]/g, '');
            fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: cleanText })
            })
            .then(res => res.blob())
            .then(blob => {
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
            });
        }

        function sendDirective() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = "";

            // Détection simple si l'utilisateur veut ajouter un rendez-vous à l'agenda
            if (message.toLowerCase().includes("agenda") || message.toLowerCase().includes("note") || message.toLowerCase().includes("rendez-vous") || message.toLowerCase().includes("précise")) {
                // Exemple d'extraction automatique ou de prise en compte
                addAgendaItem(new Date().toLocaleDateString('fr-FR') + " " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), message);
            }

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                appendMessage(data.response, 'zirco-message');
                speakText(data.response);
            });
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendDirective();
        }

        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (e) => {
                const transcript = e.results[e.results.length - 1][0].transcript;
                userInput.value = transcript;
                sendDirective();
            };

            recognition.onerror = () => {
                if (isListening) recognition.start();
            };

            recognition.onend = () => {
                if (isListening) recognition.start();
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
                micBtn.classList.remove('listening');
                userInput.placeholder = "Entrer une directive ou parler...";
            } else {
                isListening = true;
                recognition.start();
                micBtn.classList.add('listening');
                userInput.placeholder = "Écoute active en cours...";
            }
        }
    </script>
</body>
</html>
