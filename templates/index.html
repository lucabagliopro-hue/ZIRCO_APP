<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIRCO - Noyau Central</title>
    <style>
        body {
            background-color: #050b14;
            color: #00d2ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        #chat-container {
            width: 100%;
            max-width: 800px;
            height: 60vh;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid #00d2ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 12px;
            border-radius: 6px;
            line-height: 1.5;
            max-width: 85%;
        }
        .user-message {
            background: rgba(0, 100, 200, 0.3);
            border-left: 4px solid #00d2ff;
            align-self: flex-end;
            color: #ffffff;
        }
        .zirco-message {
            background: rgba(0, 200, 255, 0.1);
            border-left: 4px solid #00ffcc;
            align-self: flex-start;
            color: #00ffcc;
            white-space: pre-wrap;
        }
        #input-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: rgba(0, 10, 20, 0.9);
            border: 1px solid #00d2ff;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: #0077cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #00d2ff;
            color: #050b14;
            box-shadow: 0 0 10px #00d2ff;
        }
        #mic-btn {
            background: #222;
            border: 1px solid #00d2ff;
            font-size: 18px;
        }
        #mic-btn.listening {
            background: #ff0055;
            border-color: #ff0055;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
    </style>
</head>
<body>

    <h2>ZIRCO // SYSTEM DE BORD CENTRAL</h2>
    
    <div id="chat-container">
        <div class="message zirco-message">Système initialisé, Monsieur. Canaux opérationnels et liaison Supabase active. Quelle est votre directive ?</div>
    </div>

    <div id="input-container">
        <button id="mic-btn" onclick="toggleSpeechRecognition()" title="Activer la reconnaissance vocale">🎙️</button>
        <input type="text" id="user-input" placeholder="Entrer une directive ou parler..." onkeypress="handleKeyPress(event)">
        <button onclick="sendDirective()">EXÉCUTER</button>
    </div>

    <script>
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("userInput");
        const micBtn = document.getElementById("mic-btn");

        // Synthèse Vocale (gTTS via backend Flask)
        function speakText(text) {
            fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.blob())
            .then(blob => {
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                audio.play();
            })
            .catch(err => console.error("Erreur de synthèse vocale :", err));
        }

        // Envoi de la directive au backend
        function sendDirective() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = "";

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                appendMessage(data.response, 'zirco-message');
                speakText(data.response);
            })
            .catch(err => {
                const errorMsg = "Erreur de transmission avec le noyau.";
                appendMessage(errorMsg, 'zirco-message');
                speakText(errorMsg);
            });
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendDirective();
            }
        }

        // Reconnaissance Vocale (Web Speech API)
        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                userInput.value = speechResult;
                stopListening();
                sendDirective(); // Envoi automatique après dictée
            };

            recognition.onerror = function(event) {
                console.error("Erreur reconnaissance vocale :", event.error);
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        } else {
            micBtn.style.display = 'none'; // Masquer si non supporté par le navigateur
        }

        function toggleSpeechRecognition() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                micBtn.classList.add('listening');
                isListening = true;
                userInput.placeholder = "Écoute en cours...";
            }
        }

        function stopListening() {
            micBtn.classList.remove('listening');
            isListening = false;
            userInput.placeholder = "Entrer une directive ou parler...";
        }
    </script>
</body>
</html>
